name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: cmake --version

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Selftest
        run: ctest --test-dir build -C Release -V

      - name: Install
        run: cmake --install build --config Release --prefix install

      - name: Check package config
        run: Get-ChildItem install/lib/cmake/quarry

      - name: Build example consumer
        run: |
          cmake -S examples -B examples/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build examples/build --config Release

  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQUARRY_GPU=OFF -DQUARRY_PYTHON=OFF

      - name: Build
        run: cmake --build build -j

      - name: Selftest
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix install

      # CPU-only 安装没有 quarry::gpu，示例应自动退回 quarry::core。
      - name: Build example consumer
        run: |
          cmake -S examples -B examples/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build examples/build -j
